<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FabLab Media Initiative — AR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:transparent;font-family:system-ui,sans-serif}
  a-scene, a-scene canvas{background:transparent !important}
  .a-enter-vr{display:none !important}
  

  /* ---- hint shown while no poster is detected ---- */
  #hint{position:fixed;left:0;right:0;bottom:6vh;z-index:20;text-align:center;color:#fff;
    font-size:4vw;font-weight:700;text-shadow:0 .5vw 1vw rgba(0,0,0,.8);padding:0 8vw;display:none}
  #hint.show{display:block}

  /* ---- sound toggle, appears once the poster is found ---- */
  #sound{position:fixed;left:50%;transform:translateX(-50%);bottom:14vh;z-index:25;
    font-size:4.4vw;font-weight:800;padding:3vw 6vw;border:.8vw solid #141414;border-radius:2vw;
    background:#FFC800;color:#141414;box-shadow:.8vw .8vw 0 #141414;display:none;cursor:pointer}
  #sound.show{display:block}

  /* ---- fallback link, always available ---- */
  #plain{position:fixed;top:3vh;right:4vw;z-index:20;font-size:3.4vw;font-weight:700;
    background:rgba(20,20,20,.75);color:#FFC800;padding:2vw 3.5vw;border-radius:2vw;
    text-decoration:none;display:none}
  #plain.show{display:block}
</style>
</head>
<body>

<div id="hint">Point at the FabLab poster</div>
<div id="sound">🔇 TAP FOR SOUND</div>
<a id="plain" href="fablab-ad.mp4">Watch in Full Screen</a>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 8; warmupTolerance: 2"
  color-space="sRGB" embedded renderer="colorManagement: true, physicallyCorrectLights, alpha: true"
  vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video id="ad" src="fablab-ad.mp4" preload="auto" playsinline webkit-playsinline loop muted crossorigin="anonymous"></video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- 0.5625 x 1 = a 9:16 plane, matching the video -->
  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-video src="#ad" width="0.5625" height="1" position="0 0 0"></a-video>
  </a-entity>
</a-scene>

<script>
  const video = document.querySelector('#ad');
  const scene = document.querySelector('a-scene');
  const target = document.querySelector('#target');
  const hint  = document.querySelector('#hint');
  const plain = document.querySelector('#plain');
  const sound = document.querySelector('#sound');

  // Camera is live — tell them where to aim.
  scene.addEventListener('arReady', () => {
    hint.classList.add('show');
    plain.classList.add('show');
  });

  // Poster in view: play from the top, muted (browsers require muted for autoplay).
  target.addEventListener('targetFound', () => {
    hint.classList.remove('show');
    sound.classList.add('show');
    video.currentTime = 0;
    video.play().catch(() => {});
  });

  target.addEventListener('targetLost', () => {
    hint.classList.add('show');
    sound.classList.remove('show');
    video.pause();
  });

  sound.addEventListener('click', () => {
    video.muted = !video.muted;
    sound.textContent = video.muted ? '🔇 TAP FOR SOUND' : '🔊 SOUND ON';
  });

  // No camera (desktop, blocked permission, in-app browser).
  scene.addEventListener('arError', () => {
    hint.textContent = 'Camera unavailable — open this link in Chrome or Safari.';
    hint.classList.add('show');
    plain.classList.add('show');
  });
</script>
</body>
</html>
